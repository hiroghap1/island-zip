<body>
<header>
  <h1>離島郵便番号 CSVダウンロード</h1>
  <p class="lead">都道府県・市町村・町名から選択して CSV 出力。<strong>futureshop の特定地域別送料設定（shippingV2SpecificArea）</strong> がそのままインポートで設定できます。</p>
  <div class="toolbar">
    <button id="expandAll">すべて展開</button>
    <button id="collapseAll">すべて折りたたみ</button>
    <button id="selectAll">すべて選択</button>
    <button id="clearAll">選択解除</button>
    <input type="search" id="search" placeholder="都道府県・市町村・町名・郵便番号で検索">
    <span class="count">選択中: <strong id="selCount">0</strong> 件</span>
    <button id="download" class="primary" disabled>CSVダウンロード</button>
  </div>
</header>
<main id="tree"></main>
<footer>
  &copy; Yoshihiro Hasegawa &nbsp;X <a href="https://x.com/hiro_ghap1" target="_blank" rel="noopener">@hiro_ghap1</a>
</footer>

<script>
const tree = document.getElementById("tree");
const selCount = document.getElementById("selCount");
const downloadBtn = document.getElementById("download");
const searchInput = document.getElementById("search");

let DATA = [];
let allLeaves = [];

async function loadData() {
  try {
    const res = await fetch('./data.json');
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
    const json = await res.json();
    DATA = json.prefectures;
    buildTree();
    updateCount();
  } catch (e) {
    const dir = window.location.pathname.split('/').slice(0, -1).join('/');
    tree.innerHTML = `<div class="error-box">
      <strong style="color:#ff3b30; font-size:15px;">data.json の読み込みに失敗しました</strong>
      <div style="margin-top:8px; color:#6e6e73; font-size:13px;">${e.message}</div>
      <hr style="border:none; border-top:1px solid #e8e8ed; margin:16px 0;">
      <div style="font-size:13px; line-height:1.7;">
        <code>file://</code> で直接開くとブラウザの制限で JSON を読み込めません。<br>
        以下のいずれかの方法で開いてください:
        <ol>
          <li>ターミナルでローカルサーバを起動<pre>cd "${dir}"
python3 -m http.server 8000</pre>ブラウザで <a href="http://localhost:8000/" target="_blank">http://localhost:8000/</a> を開く</li>
          <li>VS Code の Live Server 拡張機能などを利用</li>
        </ol>
      </div>
    </div>`;
  }
}

// summary 内の checkbox クリックで details が開閉しないようにする
// preventDefault を使うと checkbox のトグル/changeイベントごと止まってしまうため、
// 自然なクリック動作はそのまま許可し、details.open だけ microtask で巻き戻す。
// microtask はペイント前に実行されるので、見た目のちらつきは発生しない。
function preventDetailsToggleFromCheckbox(detailsEl, cb) {
  cb.addEventListener("click", () => {
    const wasOpen = detailsEl.open;
    queueMicrotask(() => {
      if (detailsEl.open !== wasOpen) detailsEl.open = wasOpen;
    });
  });
}

function buildTree() {
  DATA.forEach((pref) => {
    const prefDetails = document.createElement("details");
    prefDetails.className = "pref";

    const prefSummary = document.createElement("summary");
    prefSummary.className = "lvl-1";
    const prefCb = document.createElement("input");
    prefCb.type = "checkbox";
    prefCb.dataset.level = "pref";
    const prefLabel = document.createElement("span");
    prefLabel.className = "name";
    prefLabel.textContent = pref.name;
    const prefCountLabel = document.createElement("span");
    prefCountLabel.className = "name-small";
    prefSummary.append(prefCb, prefLabel, prefCountLabel);
    preventDetailsToggleFromCheckbox(prefDetails, prefCb);
    prefDetails.append(prefSummary);

    let prefLeafCount = 0;
    pref.cities.forEach((city) => {
      const cityDetails = document.createElement("details");
      cityDetails.className = "city";

      const citySummary = document.createElement("summary");
      citySummary.className = "lvl-2";
      const cityCb = document.createElement("input");
      cityCb.type = "checkbox";
      cityCb.dataset.level = "city";
      const cityLabel = document.createElement("span");
      cityLabel.className = "name";
      cityLabel.textContent = city.name;
      const cityCount = document.createElement("span");
      cityCount.className = "name-small";
      cityCount.textContent = `(${city.items.length}件)`;
      citySummary.append(cityCb, cityLabel, cityCount);
      preventDetailsToggleFromCheckbox(cityDetails, cityCb);
      cityDetails.append(citySummary);

      city.items.forEach((item) => {
        const itemRow = document.createElement("div");
        itemRow.className = "item";
        const itemCb = document.createElement("input");
        itemCb.type = "checkbox";
        itemCb.dataset.level = "item";
        itemCb.dataset.code = item.code;
        const itemLabel = document.createElement("span");
        itemLabel.className = "name";
        if (item.name) {
          itemLabel.textContent = item.name;
        } else {
          itemLabel.innerHTML = '<span class="empty-name">（町名なし）</span>';
        }
        const itemCode = document.createElement("span");
        itemCode.className = "code";
        itemCode.textContent = item.code;
        itemRow.append(itemCb, itemLabel, itemCode);
        cityDetails.append(itemRow);
        allLeaves.push(itemCb);
        prefLeafCount++;

        itemRow.addEventListener("click", (e) => {
          if (e.target === itemCb) return;
          itemCb.checked = !itemCb.checked;
          itemCb.dispatchEvent(new Event("change"));
        });
        itemCb.addEventListener("change", () => {
          updateParents(cityCb, cityDetails.querySelectorAll('input[data-level="item"]'));
          updateParents(prefCb, prefDetails.querySelectorAll('input[data-level="item"]'));
          updateCount();
        });
      });

      cityCb.addEventListener("change", () => {
        const childCbs = cityDetails.querySelectorAll('input[data-level="item"]');
        childCbs.forEach(cb => cb.checked = cityCb.checked);
        cityCb.indeterminate = false;
        updateParents(prefCb, prefDetails.querySelectorAll('input[data-level="item"]'));
        updateCount();
      });

      prefDetails.append(cityDetails);
    });

    prefCountLabel.textContent = `(${prefLeafCount}件)`;

    prefCb.addEventListener("change", () => {
      const itemCbs = prefDetails.querySelectorAll('input[data-level="item"]');
      const cityCbs = prefDetails.querySelectorAll('input[data-level="city"]');
      itemCbs.forEach(cb => cb.checked = prefCb.checked);
      cityCbs.forEach(cb => { cb.checked = prefCb.checked; cb.indeterminate = false; });
      prefCb.indeterminate = false;
      updateCount();
    });

    tree.append(prefDetails);
  });
}

function updateParents(parentCb, childCbs) {
  const checked = Array.from(childCbs).filter(cb => cb.checked).length;
  if (checked === 0) {
    parentCb.checked = false;
    parentCb.indeterminate = false;
  } else if (checked === childCbs.length) {
    parentCb.checked = true;
    parentCb.indeterminate = false;
  } else {
    parentCb.checked = false;
    parentCb.indeterminate = true;
  }
}

function updateCount() {
  const n = allLeaves.filter(cb => cb.checked).length;
  selCount.textContent = n.toLocaleString();
  downloadBtn.disabled = n === 0;
}

function downloadCSV() {
  const codes = allLeaves.filter(cb => cb.checked).map(cb => cb.dataset.code);
  const csv = "郵便番号\r\n" + codes.join("\r\n") + "\r\n";
  const bom = "﻿";
  const blob = new Blob([bom + csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const ts = new Date().toISOString().replace(/[:T]/g, "-").slice(0, 16);
  a.download = `shippingV2SpecificArea-${ts}.csv`;
  document.body.append(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById("expandAll").addEventListener("click", () => {
  tree.querySelectorAll("details").forEach(d => d.open = true);
});
document.getElementById("collapseAll").addEventListener("click", () => {
  tree.querySelectorAll("details").forEach(d => d.open = false);
});
document.getElementById("selectAll").addEventListener("click", () => {
  allLeaves.forEach(cb => cb.checked = true);
  tree.querySelectorAll('input[data-level="city"], input[data-level="pref"]').forEach(cb => {
    cb.checked = true;
    cb.indeterminate = false;
  });
  updateCount();
});
document.getElementById("clearAll").addEventListener("click", () => {
  allLeaves.forEach(cb => cb.checked = false);
  tree.querySelectorAll('input[data-level="city"], input[data-level="pref"]').forEach(cb => {
    cb.checked = false;
    cb.indeterminate = false;
  });
  updateCount();
});
downloadBtn.addEventListener("click", downloadCSV);

searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    tree.querySelectorAll("details, .item").forEach(el => el.classList.remove("hidden"));
    tree.querySelectorAll("details").forEach(d => d.open = false);
    return;
  }
  tree.querySelectorAll("details.pref").forEach(prefDetails => {
    let prefMatch = false;
    const prefName = prefDetails.querySelector("summary.lvl-1 .name").textContent.toLowerCase();
    prefDetails.querySelectorAll("details.city").forEach(cityDetails => {
      let cityMatch = false;
      const cityName = cityDetails.querySelector("summary.lvl-2 .name").textContent.toLowerCase();
      cityDetails.querySelectorAll(".item").forEach(itemRow => {
        const townName = itemRow.querySelector(".name").textContent.toLowerCase();
        const code = itemRow.querySelector(".code").textContent.toLowerCase();
        const hit = prefName.includes(q) || cityName.includes(q) || townName.includes(q) || code.includes(q);
        itemRow.classList.toggle("hidden", !hit);
        if (hit) cityMatch = true;
      });
      cityDetails.classList.toggle("hidden", !cityMatch);
      cityDetails.open = cityMatch;
      if (cityMatch) prefMatch = true;
    });
    prefDetails.classList.toggle("hidden", !prefMatch);
    prefDetails.open = prefMatch;
  });
});

loadData();
</script>
</body>
